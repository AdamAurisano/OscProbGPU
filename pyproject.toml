[build-system]
requires = ["scikit-build-core>=0.8"]  # nanobind is vendored in third_party/
build-backend = "scikit_build_core.build"

[project]
name = "oscprobgpu"
version = "0.1.0"
description = "CUDA port of selected OscProb neutrino oscillation calculators"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = []
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
OPG_ENABLE_PYTHON = "ON"
OPG_ENABLE_TESTS = "OFF"
