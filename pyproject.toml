[build-system]
requires = ["scikit-build-core>=0.8"]  # nanobind is vendored in third_party/
build-backend = "scikit_build_core.build"

[project]
name = "oscprobgpu"
version = "0.1.0"
description = "CUDA port of selected OscProb neutrino oscillation calculators"
readme = "README.md"
# BSD-3-Clause; portions derived from OscProb also MIT (LICENSE-OscProb); include/opg/linalg/kopp/ LGPL-2.1-or-later
# (from Joachim Kopp's code); third_party/ (own licenses).
license = { text = "BSD-3-Clause AND MIT AND LGPL-2.1-or-later" }
classifiers = [
  "License :: OSI Approved :: BSD License",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
]
requires-python = ">=3.8"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = []
wheel.license-files = ["LICENSE", "LICENSE-OscProb", "include/opg/linalg/kopp/COPYING", "third_party/nanobind/LICENSE"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
OPG_ENABLE_PYTHON = "ON"
OPG_ENABLE_TESTS = "OFF"
