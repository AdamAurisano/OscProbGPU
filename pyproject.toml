[build-system]
requires = ["scikit-build-core>=0.8"]  # nanobind is vendored in third_party/
build-backend = "scikit_build_core.build"

[project]
name = "oscprobgpu"
version = "0.1.0"
description = "CUDA port of selected OscProb neutrino oscillation calculators"
readme = "README.md"
# Wheels: BSD-3-Clause; portions derived from OscProb also MIT (LICENSE-OscProb); vendored nanobind BSD-3-Clause and
# its robin_map MIT. The LGPL Kopp port (include/opg/linalg/kopp/) is compiled only with OPG_OSCPROB_BITWISE=ON, which
# wheels do not set; a build with it is also LGPL-2.1-or-later. README and docs/: CC BY 4.0 (LICENSE-docs).
license = { text = "BSD-3-Clause AND MIT" }
classifiers = [
  "License :: OSI Approved :: BSD License",
  "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.8"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = []
wheel.license-files = ["LICENSE", "LICENSE-OscProb", "LICENSE-docs", "third_party/nanobind/LICENSE",
                       "third_party/nanobind/ext/robin_map/LICENSE"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
OPG_ENABLE_PYTHON = "ON"
OPG_ENABLE_TESTS = "OFF"
